[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "airmatrix"
version = "0.2.0"
description = "AirMatrix Flight & Baggage Management System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
